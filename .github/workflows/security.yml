name: Repository security
on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
permissions:
  contents: read
jobs:
  security:
    name: Secrets and workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install checksum-verified security tools
        run: |
          bash scripts/install_ci_tools.sh "$RUNNER_TEMP/security-tools"
          echo "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - name: Validate workflow syntax
        run: actionlint -color
      - name: Prove the scanner catches synthetic leaks
        env:
          REQUIRE_GITLEAKS: '1'
        run: python -m unittest discover -s tests -p test_security.py -v
      - name: Build and scan history, files, and archives
        run: |
          python scripts/build.py
          python scripts/scan_secrets.py
