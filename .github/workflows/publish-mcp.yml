name: Publish MCP Registry entries
# Publishes mcp-registry/*/server.json to registry.modelcontextprotocol.io.
# Leave "publish" unchecked for a dry run: it checks the entries and the live
# servers, and shows what would be published. It never reads the signing key.
# Run every Python script with -I: Python then imports nothing from the checkout
# but the script itself, so a file in scripts/ without a code owner cannot run here.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish new versions after approval. Runs only on main.
        required: false
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Check entries and live servers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned publisher
        run: bash scripts/install_mcp_publisher.sh "$RUNNER_TEMP/mcp-publisher"
      - name: Check the allowlist and smoke-test the live servers
        run: python -I scripts/mcp_registry.py check
      - name: Validate the entries with the registry
        run: |
          for manifest in mcp-registry/*/server.json; do
            "$RUNNER_TEMP/mcp-publisher/mcp-publisher" validate "$manifest"
          done
      - name: Show what a publish would do
        run: python -I scripts/mcp_registry.py plan

  publish:
    name: Publish to the MCP Registry
    needs: check
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds MCP_REGISTRY_DNS_KEY, allows only main, and needs a reviewer's approval.
    environment: mcp-registry-production
    concurrency:
      group: mcp-registry-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned publisher
        run: bash scripts/install_mcp_publisher.sh "$RUNNER_TEMP/mcp-publisher"
      # Plan again: the registry can change while the run waits for approval.
      - name: Plan the publish
        id: plan
        run: |
          python -I scripts/mcp_registry.py plan > "$RUNNER_TEMP/publish-list.txt"
          if [ -s "$RUNNER_TEMP/publish-list.txt" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the new entries
        if: steps.plan.outputs.publish == 'true'
        run: |
          while IFS= read -r manifest; do
            "$RUNNER_TEMP/mcp-publisher/mcp-publisher" validate "$manifest"
          done < "$RUNNER_TEMP/publish-list.txt"
      # The publisher reads the hex key from MCP_PRIVATE_KEY, so the key never appears in a command line.
      - name: Sign in with the voiceflow.com DNS key
        if: steps.plan.outputs.publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          if [[ ! "$MCP_PRIVATE_KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::MCP_REGISTRY_DNS_KEY is missing or is not a 64-character hex Ed25519 key."
            exit 1
          fi
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" login dns --domain voiceflow.com
      - name: Publish the new entries
        if: steps.plan.outputs.publish == 'true'
        run: |
          while IFS= read -r manifest; do
            "$RUNNER_TEMP/mcp-publisher/mcp-publisher" publish "$manifest"
          done < "$RUNNER_TEMP/publish-list.txt"
      - name: Sign out
        if: always() && steps.plan.outputs.publish == 'true'
        run: '"$RUNNER_TEMP/mcp-publisher/mcp-publisher" logout'
      - name: Read back the public records
        run: python -I scripts/mcp_registry.py verify
