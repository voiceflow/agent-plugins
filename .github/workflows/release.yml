name: Prepare draft package release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full source commit SHA; tag v<version> must already point at it
        required: true
        type: string
      version:
        description: Package version, without v
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Read the guard from the default branch, never the candidate source commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify release source and workflow branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_WORKFLOW_REF: ${{ github.ref }}
        run: |
          python3 scripts/verify_release_source.py \
            --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT" \
            --version "$RELEASE_VERSION" --workflow-ref "$RELEASE_WORKFLOW_REF"
  checks:
    needs: validate-inputs
    uses: ./.github/workflows/check.yml
    with:
      source_ref: ${{ inputs.commit }}
  assets:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare verified assets
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/prepare_release.py --expected-version "$RELEASE_VERSION" --expected-commit "$RELEASE_COMMIT"
      - name: Scan the exact release assets
        run: |
          bash scripts/install_ci_tools.sh "$RUNNER_TEMP/security-tools"
          python scripts/scan_secrets.py --gitleaks "$RUNNER_TEMP/security-tools/gitleaks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout, source execution, dependency installation, or PR artifacts here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: release-assets
      - name: Create an unpublished beta release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          # This job has no Git credentials or checkout; query through the scoped token.
          # The Version workflow creates the tag. This job never creates, moves, or deletes one.
          tag_ref="$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .object.type + \" \" + .object.sha")"
          read -r tag_type tag_sha <<<"$tag_ref" || true
          if [ "${tag_type:-}" = tag ]; then
            tag_sha="$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object.sha')"
          fi
          if [ -z "${tag_sha:-}" ] || [ "$tag_sha" != "$RELEASE_COMMIT" ]; then
            echo "Refusing to draft: tag $tag must already exist at the release commit." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release or draft.' >&2
            exit 1
          fi
          gh release create "$tag" --verify-tag --draft --prerelease \
            --title "Voiceflow $tag (beta)" --notes-file release-assets/release-notes.md \
            release-assets/*.zip release-assets/manifest.json release-assets/SHA256SUMS
